<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake mini-game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Barlow+Condensed:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; height: {{height}}; overflow: hidden; background: #0b1a12; font-family: 'Silkscreen', monospace; color: #eef3ea">
<div aria-hidden="true" style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); grid-template-rows: repeat(10, minmax(0, 1fr))">
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="160">
<div style="background: {{cell.bg}}"></div>
</sc-for>
</div>

<div style="position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; font-size: 11px">
<span style="background: #08130e; border: 1px solid #3a6150; padding: 2px 7px">{{modeLabel}} · {{score}}</span>
<span style="background: #08130e; border: 1px solid #3a6150; padding: 2px 7px">best {{best}}</span>
</div>

<sc-if value="{{over}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: #08130ed9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
<div style="font-size: 12px; color: #a7bcae">Full time</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase">You scored {{last}}</div>
<div style="font-size: 10px; color: #cfe0d4">A: play again · Exit: back to the page</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#f5d547"},"sound":{"editor":"boolean","default":false},"mode":{"editor":"enum","options":["attract","play"],"default":"attract"},"pad":{"editor":null},"playKey":{"editor":null},"height":{"editor":"text","default":"220px"},"$preview":{"width":360,"height":220}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.W = 16;
    this.H = 10;
    this.prevPad = {};
    this.state = this.fresh(props.mode === 'play' ? 'human' : 'ai', 0);
  }
  componentDidMount() {
    this.timer = setInterval(() => { this.readPad(); this.step(); }, 140);
    this.padTimer = setInterval(() => this.readPad(), 30);
  }
  componentDidUpdate(prev) {
    if (prev.playKey !== this.props.playKey || prev.mode !== this.props.mode) {
      this.prevPad = {};
      this.setState(this.fresh(this.props.mode === 'play' ? 'human' : 'ai', this.state.best));
    }
  }
  // the shared controller arrives as the pad prop; act on presses, not holds
  readPad() {
    if (this.props.mode !== 'play') return;
    const p = this.props.pad || {};
    const prev = this.prevPad;
    this.prevPad = { ...p };
    if (this.state.mode === 'over') {
      if (p.a && !prev.a) this.play();
      return;
    }
    if (p.up && !prev.up) this.steer([0, -1]);
    else if (p.down && !prev.down) this.steer([0, 1]);
    else if (p.left && !prev.left) this.steer([-1, 0]);
    else if (p.right && !prev.right) this.steer([1, 0]);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    clearInterval(this.padTimer);
  }
  fresh(mode, best) {
    return { snake: [[5, 5], [4, 5], [3, 5]], dir: [1, 0], food: [11, 4], score: 0, mode, best, queued: null, last: 0 };
  }
  audio() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ac = new AC();
    }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  }
  tone(type, f0, f1, dur, vol) {
    if (!this.props.sound) return;
    const ac = this.audio();
    if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  hit(x, y, body) {
    if (x < 0 || y < 0 || x >= this.W || y >= this.H) return true;
    return body.some(([a, b]) => a === x && b === y);
  }
  room(start, body) {
    const blocked = new Set(body.map(([x, y]) => x + ',' + y));
    const seen = new Set([start[0] + ',' + start[1]]);
    const queue = [start];
    let n = 0;
    while (queue.length && n < 60) {
      const [x, y] = queue.shift();
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
        const nx = x + dx;
        const ny = y + dy;
        const key = nx + ',' + ny;
        if (nx < 0 || ny < 0 || nx >= this.W || ny >= this.H || blocked.has(key) || seen.has(key)) return;
        seen.add(key);
        queue.push([nx, ny]);
        n++;
      });
    }
    return n;
  }
  aiDir(st) {
    const [dx, dy] = st.dir;
    const options = [[dx, dy], [dy, -dx], [-dy, dx]];
    let best = null;
    let bestScore = -Infinity;
    options.forEach((d, i) => {
      const h = [st.snake[0][0] + d[0], st.snake[0][1] + d[1]];
      const eat = h[0] === st.food[0] && h[1] === st.food[1];
      const body = eat ? st.snake : st.snake.slice(0, -1);
      if (this.hit(h[0], h[1], body)) return;
      let s = -(Math.abs(h[0] - st.food[0]) + Math.abs(h[1] - st.food[1]));
      if (this.room(h, [h].concat(body)) < st.snake.length + 2) s -= 100;
      if (i === 0) s += 0.3;
      if (s > bestScore) { bestScore = s; best = d; }
    });
    return best || st.dir;
  }
  freeCell(snake) {
    const taken = new Set(snake.map(([x, y]) => x + ',' + y));
    const free = [];
    for (let y = 0; y < this.H; y++) {
      for (let x = 0; x < this.W; x++) {
        if (!taken.has(x + ',' + y)) free.push([x, y]);
      }
    }
    return free[Math.floor(Math.random() * free.length)] || [0, 0];
  }
  step() {
    const st = this.state;
    if (st.mode === 'over') return;
    const dir = st.mode === 'ai' ? this.aiDir(st) : (st.queued || st.dir);
    const head = [st.snake[0][0] + dir[0], st.snake[0][1] + dir[1]];
    const eat = head[0] === st.food[0] && head[1] === st.food[1];
    const body = eat ? st.snake : st.snake.slice(0, -1);
    if (this.hit(head[0], head[1], body)) {
      const best = Math.max(st.best, st.score);
      if (st.mode === 'ai') {
        this.setState(this.fresh('ai', best));
      } else {
        this.tone('sawtooth', 220, 55, 0.4, 0.05);
        this.setState({ mode: 'over', last: st.score, best });
      }
      return;
    }
    const snake = [head].concat(body);
    if (eat && st.mode === 'human') this.tone('square', 660, 1100, 0.07, 0.04);
    this.setState({
      snake,
      dir,
      food: eat ? this.freeCell(snake) : st.food,
      score: eat ? st.score + 1 : st.score,
      queued: null
    });
  }
  steer(d) {
    const st = this.state;
    if (st.mode !== 'human') return;
    const cur = st.queued || st.dir;
    if (cur[0] === -d[0] && cur[1] === -d[1]) return;
    this.setState({ queued: d });
  }
  play() {
    this.tone('square', 520, 780, 0.08, 0.04);
    this.setState(this.fresh('human', this.state.best));
  }
  renderVals() {
    const st = this.state;
    const accent = this.props.accent ?? '#f5d547';
    const pos = {};
    st.snake.forEach(([x, y], i) => { pos[x + ',' + y] = i; });
    const cells = [];
    for (let y = 0; y < this.H; y++) {
      for (let x = 0; x < this.W; x++) {
        const i = pos[x + ',' + y];
        let bg = (x + y) % 2 ? '#0f2418' : '#0c1f14';
        if (i === 0) bg = '#c4f5a8';
        else if (i !== undefined) bg = i % 2 ? '#4fae5a' : '#45a050';
        else if (x === st.food[0] && y === st.food[1]) bg = '#e5432f';
        cells.push({ bg });
      }
    }
    const keys = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
    };
    return {
      accent,
      height: this.props.height || '220px',
      cells,
      score: st.score,
      best: Math.max(st.best, st.score),
      last: st.last,
      modeLabel: st.mode === 'ai' ? 'Bot playing' : 'You',
      human: st.mode === 'human',
      over: st.mode === 'over',
      showControl: st.mode !== 'over',
      controlText: st.mode === 'ai' ? 'Take control' : 'Arrow keys / WASD',
      controlLabel: st.mode === 'ai' ? 'Take control of the snake' : 'Steer with arrow keys or WASD',
      control: () => { if (this.state.mode === 'ai') this.play(); },
      again: () => this.play(),
      watch: () => this.setState(this.fresh('ai', this.state.best)),
      onKey: (e) => {
        const d = keys[e.key];
        if (!d) return;
        e.preventDefault();
        if (this.state.mode === 'human') this.steer(d);
        else this.play();
      },
      up: () => this.steer([0, -1]),
      down: () => this.steer([0, 1]),
      left: () => this.steer([-1, 0]),
      right: () => this.steer([1, 0])
    };
  }
}
</script>
</body>
</html>
